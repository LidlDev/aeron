name: Build, test and deploy AERON
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test training workflows
        run: npm test
      - name: Build application
        run: npm run build
      - name: Set up Python for browser checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test tools
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test mobile workflows against production build
        env:
          AERON_URL: http://localhost:3001
          CHROMIUM_PATH: ""
        run: |
          python -m http.server 3001 --bind 127.0.0.1 --directory dist > /tmp/aeron-preview.log 2>&1 &
          python scripts/browser-smoke.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
